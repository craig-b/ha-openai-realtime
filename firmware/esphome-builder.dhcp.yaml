# ============================================================================
# Per-device stub, to build the OpenAI Realtime Voice PE firmware yourself.
#
# Most people don't need this: install the prebuilt firmware (INSTALL.md), which
# Home Assistant sets up and updates. Build it yourself to change it, or to keep
# Wi-Fi, the API key or the link to the add-on in the build instead of setting
# them at runtime. Every block marked optional can go: whatever is left out is
# set as with the prebuilt firmware (Wi-Fi over Bluetooth, the API key by Home
# Assistant, the link by the add-on's integration).
#
# Copy this into ESPHome Device Builder once (take control of the device, then
# edit its YAML), and put the secrets it uses in Builder -> Secrets.
#
# For a fixed IP, use esphome-builder.static-ip.yaml instead.
# ============================================================================
substitutions:
  name: home-assistant-voice-xxxxxx   # your device's name: keep it stable
  friendly_name: Home Assistant Voice

esphome:
  name_add_mac_suffix: false

# Long form on purpose: the github:// shorthand has no refresh option, and
# ESPHome then caches the downloaded yaml for a day; refresh: 0s makes every
# compile fetch the latest.
packages:
  realtime:
    url: https://github.com/craig-b/ha-openai-realtime
    ref: main
    files: [firmware/home-assistant-voice.realtime.yaml]
    refresh: 0s

# Uploads from ESPHome Builder, with a password: how a self-built firmware
# gets its own updates. (The prebuilt firmware takes no uploads, so the first
# install of a self-built one onto it is over USB.)
ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

# Updates come from Builder, which rebuilds with this stub: not from the
# prebuilt firmware's releases, whose image would replace what's built in here.
update: !remove

dashboard_import:
  package_import_url: github://craig-b/ha-openai-realtime/firmware/home-assistant-voice.realtime.yaml@main
  import_full_config: false

# Optional: Wi-Fi in the build.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Optional: your own API key.
api:
  encryption:
    key: !secret api_key

# Optional: the link to the add-on in the build: its address (wss://, the
# add-on's port), its device_secret, and the certificate its log prints.
va_client:
  url: !secret va_url
  secret: !secret va_secret
  certificate: !secret va_certificate
