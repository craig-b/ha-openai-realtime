name: Add-on

# Every push and pull request builds the add-on image for both architectures
# and checks that the app's modules import inside it. A v<version> tag also
# publishes the images to GHCR, where config.yaml's `image:` points. Every
# other run checks that the images config.yaml points at can be pulled, so
# main never sends Home Assistant to an image that isn't there (RELEASING.md).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'openai_realtime_voice_agent/**'
      - '.github/workflows/build-addon.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  ADDON_DIR: openai_realtime_voice_agent
  IMAGE_TEMPLATE: ghcr.io/${{ github.repository_owner }}/{arch}-openai-realtime-voice-agent

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Same uv as the Dockerfile; no cache, since tag runs publish images.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.15"
          enable-cache: false

      # Python 3.11 is what the image's Debian bookworm runs.
      - name: Run the tests
        working-directory: openai_realtime_voice_agent
        run: uv run --frozen --python 3.11 pytest

  published:
    name: Published images
    # A tag is what publishes them.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Pulled without logging in, as Home Assistant does: an image that
      # exists but isn't public fails too. config.yaml can be changed by a
      # pull request, so its values are validated before use.
      - name: Check every architecture's image can be pulled
        run: |
          config="$ADDON_DIR/config.yaml"
          image=$(sed -n 's/^image: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$config")
          if [ -z "$image" ]; then
            echo "config.yaml has no image: Home Assistant builds the add-on itself"
            exit 0
          fi
          expected=$(echo "$IMAGE_TEMPLATE" | tr '[:upper:]' '[:lower:]')
          [ "$image" = "$expected" ] || { echo "::error::config.yaml image '$image' is not this workflow's '$expected'"; exit 1; }
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' "$config")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version '$version' in config.yaml"; exit 1; }
          archs=$(sed -n '/^arch:/,/^[^ ]/s/^  - \([a-z0-9]*\)$/\1/p' "$config")
          [ -n "$archs" ] || { echo "::error::no arch list in config.yaml"; exit 1; }
          missing=0
          for arch in $archs; do
            ref="${image/\{arch\}/$arch}:$version"
            if docker manifest inspect "$ref" > /dev/null 2>&1; then
              echo "✅ $ref"
            else
              echo "::error::$ref can't be pulled: push tag v$version to publish it, and make the package public"
              missing=1
            fi
          done
          exit "$missing"

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Pull requests from forks always get a read-only token regardless, and
      # the push steps only run on tags.
      packages: write  # publish images to GHCR on version tags
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # config.yaml can be changed by a pull request, so the version is
      # validated here and only ever reaches the shell through env.
      - name: Read version and check image pins
        id: meta
        run: |
          version=$(sed -n 's/^version: "\(.*\)"$/\1/p' "$ADDON_DIR/config.yaml")
          image=$(echo "$IMAGE_TEMPLATE" | sed "s/{arch}/$ARCH/" | tr '[:upper:]' '[:lower:]')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version '$version' in config.yaml"; exit 1; }
          unpinned=$(grep -nE '^(FROM|COPY --from=)' "$ADDON_DIR/Dockerfile" | grep -vE '@sha256:[0-9a-f]{64}' || true)
          [ -z "$unpinned" ] || { echo "::error::Dockerfile images must be pinned by digest: $unpinned"; exit 1; }
          {
            echo "version=$version"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - name: Check the tag matches config.yaml
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match config.yaml version $VERSION"
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        if: matrix.arch != 'amd64'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Same flags and build args the Supervisor passes when it builds the
      # add-on locally (supervisor/apps/build.py), so CI tests the users' path.
      - name: Build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker buildx build "$ADDON_DIR" \
            --platform "$PLATFORM" \
            --pull \
            --build-arg "BUILD_VERSION=$VERSION" \
            --build-arg "BUILD_ARCH=$ARCH" \
            --label io.hass.type=addon \
            --label "io.hass.arch=$ARCH" \
            --label "io.hass.version=$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$IMAGE:$VERSION" \
            --load

      - name: Check the app imports
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker run --rm --platform "$PLATFORM" --entrypoint python3 -w / "$IMAGE:$VERSION" -c '
          import importlib, pkgutil, app
          names = [m.name for m in pkgutil.iter_modules(app.__path__)]
          for name in names:
              importlib.import_module("app." + name)
          print(f"{len(names)} modules import")'

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: docker push "$IMAGE:$VERSION"
