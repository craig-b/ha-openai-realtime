name: OpenAI Realtime 2 Voice Agent
version: "0.7.0"
slug: openai_realtime_voice_agent
description: Talk to your home with OpenAI gpt-realtime-2.1 — a voice agent for the Home Assistant Voice PE, with live device control and web search.
url: https://github.com/craig-b/ha-openai-realtime
arch:
  - aarch64
  - amd64
init: false
# Home Assistant pulls the image CI published for this version (a v<version>
# tag publishes it; RELEASING.md), instead of building the add-on itself.
image: "ghcr.io/craig-b/{arch}-openai-realtime-voice-agent"
startup: application
boot: auto
host_network: true
# Gives the add-on SUPERVISOR_TOKEN so it can reach Home Assistant (used as a
# fallback auth token for the MCP server when longlived_token is left blank).
homeassistant_api: true
# /config inside the add-on is its own folder in Home Assistant's
# addon_configs share; enable_recording writes its recordings there.
map:
  - type: addon_config
    read_only: false

# ----------------------------------------------------------------------------
# Options are ORDERED for the Configuration tab (HA renders them in this order)
# and pseudo-grouped via name prefixes in translations/{en,nl}.yaml:
#   🔑 Basics (with the engine) → ⚡ Realtime settings and 🎙️ GPT-Live settings
#   (sections) → 💬 Conversation → 🌐 Web search → 🎚️ Audio → 🏠 Home Assistant
#   → ⚙️ Advanced → 🔍 Debug
# Options that only one engine uses live in that engine's section. Saved
# settings from before the sections are moved into them by app/migrate.py, as
# are saved prompts from before house_rules.
# User-facing help lives in translations/, not here — keep comments dev-facing.
#
# REMOVED options (v0.4.29) — hardcoded to the only sane value; config.py keeps
# env fallbacks so absent vars are fine:
#   semantic_vad_create_response → true  (false: nothing answers a turn; the
#     add-on only creates responses after tool calls)
#   interrupt_response → now follows realtime → mute_mic_while_speaking: OpenAI may stop
#     its reply on the user's speech only when the mic stays open during it
#   device_input_sample_rate → 16000  (the Voice PE firmware always sends 16k)
# The server_vad escape hatch (turn_detection_type + vad_*) and the *_custom
# escape-hatch fields are KEPT, optional without defaults (see the realtime
# section).
# NB the add-on UI renders every string option as a SINGLE-LINE input — there
# is no multiline/textarea support in the frontend (verified in
# supervisor-app-config.ts), so long text like house_rules is best edited
# via the Configuration tab's ⋮ → "Edit in YAML".
# ----------------------------------------------------------------------------
options:
  # --- 🔑 Basics ---
  openai_api_key: ""
  device_secret: ""
  engine: "realtime"
  # The owner's part of the prompt; the add-on's own rules are in app/prompts.py.
  house_rules: >-
    You are calm and brief, like a good concierge: warm, never chatty. Speak and
    understand only English, with a natural, neutral accent. Never switch language, not even for stray foreign
    words or an accent; do not infer the language from accent or a single word.

  # --- ⚡ Realtime settings: a section of its own (a collapsible panel) ---
  # The *_custom fields and the legacy server_vad fields (turn_detection_type,
  # vad_*) have NO defaults: optional. Inside a section the UI shows them
  # anyway (its "Show unused optional" filter only covers top-level options);
  # their help says when they apply. semantic_vad is config.py's default.
  realtime:
    model: "gpt-realtime-2.1"
    voice: "marin"
    speed: 1.0
    reasoning_effort: "low"
    max_output_tokens: 0
    vad_eagerness: "low"
    noise_reduction: "off"
    web_search_model: "gpt-6-luna"
    max_context_tokens: 8000
    # Its own voice leaks back into the Voice PE's open mic and cuts it off
    # (verified live 2026-10-22), so Realtime keeps the mic shut while it speaks.
    mute_mic_while_speaking: true
    session_reuse_timeout_seconds: 300

  # --- 🎙️ GPT-Live settings: a section of its own ---
  # *_custom fields have NO defaults: optional (shown anyway, as above).
  live:
    model: "gpt-live-1"
    voice: "marin"
    backend_model: "gpt-6-luna"
    reasoning_effort: "low"
    service_tier: "auto"
    # 0: a GPT-Live session bills every minute it is open.
    session_reuse_timeout_seconds: 0
    # GPT-Live let the user talk over it without hearing its own voice
    # (verified live 2026-10-22): the mic stays open.
    mute_mic_while_speaking: false

  # --- 💬 Conversation ---
  follow_up_listen_seconds: 8
  # 700 (not 0/200): a reply tail that survives the device AEC and arrives
  # ALONE in the open follow-up mic becomes a ghost turn — verified live
  # 2026-06-12 23:18 at 300 ms: the reply's own i2s/DAC tail (~600 ms) leaked
  # into the fresh mic, the VAD committed it as an (empty) turn and the model
  # answered the previous question AGAIN. 700 covers the tail with margin.
  follow_up_open_delay_ms: 700
  # Same echo guard at the WAKE boundary: delay after the wake chime before the
  # mic opens. The chime's own i2s/DAC tail otherwise leaks into the fresh mic
  # and becomes a ghost turn (verified live 2026-06-12 23:27 — a wake produced
  # an unprompted answer). Was a hardcoded 400 ms in the firmware yaml; now sent
  # in `hello` so it's tunable like follow_up_open_delay_ms.
  wake_open_delay_ms: 700
  phase_idle_debounce_ms: 1500
  enable_end_conversation: true

  # --- 🌐 Web search ---
  enable_web_search: true

  # --- 🎚️ Audio ---
  # 150 (not 0): cushions WS jitter so the speaker doesn't run dry mid-word
  # (the start-of-reply crackle); costs 150 ms of reply latency.
  playback_prebuffer_ms: 150

  # --- 🏠 Home Assistant ---
  ha_mcp_url: ""
  longlived_token: ""
  mcp_tool_allowlist: ""
  home_town: ""

  # --- ⚙️ Advanced ---
  websocket_port: 8080

  # --- 🔍 Debug ---
  log_what_you_say: false
  transcription_language: ""
  enable_recording: false
  log_level: "INFO"

schema:
  # --- 🔑 Basics ---
  openai_api_key: password
  device_secret: password
  engine: "list(realtime|live)"
  house_rules: str
  # --- ⚡ Realtime settings ---
  realtime:
    model: "list(gpt-realtime-2.1|gpt-realtime-2.1-mini|gpt-realtime-2|gpt-realtime-1.5|custom)"
    model_custom: str?
    voice: "list(marin|cedar|alloy|ash|ballad|coral|echo|sage|shimmer|verse|custom)"
    voice_custom: str?
    speed: float(0.25,1.5)
    reasoning_effort: "list(minimal|low|medium|high|xhigh)"
    max_output_tokens: int(0,4096)
    vad_eagerness: "list(low|medium|high|auto)"
    noise_reduction: "list(off|near_field|far_field)"
    web_search_model: "list(gpt-6-luna|gpt-6.1-sol|gpt-6-astra|custom)"
    web_search_model_custom: str?
    max_context_tokens: int(0,128000)
    mute_mic_while_speaking: bool
    session_reuse_timeout_seconds: int(0,3600)
    # Legacy server_vad escape hatch.
    turn_detection_type: "list(semantic_vad|server_vad)?"
    vad_threshold: "float(0,1)?"
    vad_prefix_padding_ms: int?
    vad_silence_duration_ms: int?
  # --- 🎙️ GPT-Live settings ---
  live:
    model: str
    voice: "list(marin|quartz|ripple|vesper|willow|stone|gleam|meridian|bossa|tempo|beacon|delta|cinder|nuri|juni|flitz|brise|sillage|nira|harema|shida|noeul|custom)"
    voice_custom: str?
    backend_model: "list(gpt-6-luna|gpt-6.1-sol|gpt-6-astra|custom)"
    backend_model_custom: str?
    # The gpt-6 models' efforts: "none" where the realtime models have "minimal".
    reasoning_effort: "list(none|low|medium|high|xhigh)"
    service_tier: "list(auto|default|priority)"
    session_reuse_timeout_seconds: int(0,3600)
    mute_mic_while_speaking: bool
  # --- 💬 Conversation ---
  follow_up_listen_seconds: int(0,60)
  follow_up_open_delay_ms: int(0,5000)
  wake_open_delay_ms: int(0,5000)
  phase_idle_debounce_ms: int(0,10000)
  enable_end_conversation: bool
  # --- 🌐 Web search ---
  enable_web_search: bool
  # --- 🎚️ Audio ---
  playback_prebuffer_ms: int(0,2000)
  # --- 🏠 Home Assistant ---
  ha_mcp_url: str
  longlived_token: password
  mcp_tool_allowlist: str
  home_town: str?
  # --- ⚙️ Advanced ---
  websocket_port: int(1024,65535)
  # --- 🔍 Debug ---
  log_what_you_say: bool
  transcription_language: str?
  enable_recording: bool
  log_level: "list(DEBUG|INFO|WARNING)"
# No `image:` key -> Home Assistant builds the add-on locally from the
# Dockerfile in this directory. This makes the fork work
# without publishing images to a registry. Advanced users who prefer fast
# installs can publish via the included GitHub Actions workflow and set:
#   image: ghcr.io/<your-gh-user>/ha-openai-realtime/openai-realtime-voice-agent-{arch}
