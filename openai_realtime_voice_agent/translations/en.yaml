# User-facing names + help for the Configuration tab. The emoji prefixes are
# the only "grouping" HA's add-on UI supports — they match the order/groups in
# config.yaml. Keep descriptions PRACTICAL: what it does, when to change it,
# what value makes sense. A Dutch version lives in nl.yaml.
configuration:
  # --- 🔑 Basics ---
  openai_api_key:
    name: "🔑 Basics · OpenAI API key"
    description: >-
      Your personal OpenAI key (starts with sk-...). Create one at
      platform.openai.com → API keys, and make sure billing is set up.
      Everything the assistant does — listening, thinking, speaking, web
      search — runs on this key.
  device_secret:
    name: "🔑 Basics · Device secret"
    description: >-
      A password your Voice PE must present to connect to this add-on, so
      nothing else on your network can talk to the assistant through it. Use
      at least 16 characters with no spaces, e.g. the output of
      `openssl rand -hex 32`, and put the same value in your ESPHome
      secrets.yaml as va_secret. The add-on doesn't start without one.

  engine:
    name: "🔑 Basics · Engine"
    description: >-
      Which kind of OpenAI voice model to use. "realtime" (default): one model
      listens, thinks and speaks, in turns. "live": GPT-Live, a voice that
      listens and speaks at once and hands anything that needs doing to a
      smarter backend model; it bills each minute a conversation is open
      ($0.05) plus the backend's tokens. Each engine has its own settings
      panel below; only the chosen one's are used.

  # --- ⚡ Realtime ---
  realtime:
    name: "⚡ Realtime settings"
    description: >-
      Settings for the Realtime engine (Engine: realtime): OpenAI's gpt-realtime models, which
      listen, think and speak in one model.
    fields:
      instructions:
        name: "Assistant personality (system prompt)"
        description: >-
          Plain-text instructions that shape the assistant: its personality, its
          language, and your house rules. Write it like you'd brief a person. Two
          tips that matter on a voice device: lock the language ("Speak and
          understand only Dutch. Never switch language.") and tell it to use its
          tools silently instead of saying "one moment". EDITING TIP: this field
          is a single line here (a Home Assistant UI limitation) — for comfortable
          editing use the ⋮ menu at the top of this tab → "Edit in YAML", which
          gives you a full text editor.
      model:
        name: "Model"
        description: >-
          The OpenAI model that listens and talks. gpt-realtime-2.1 (default) is
          the newest and smartest. gpt-realtime-2.1-mini is much cheaper but less
          capable. gpt-realtime-2 is the one before 2.1. gpt-realtime-1.5 is the
          older one that doesn't reason. Want a model that's not listed? Pick "custom" and fill in
          Model (custom) below.
      model_custom:
        name: "Model (custom)"
        description: >-
          Only used when Model is set to "custom". Any valid OpenAI Realtime
          model id.
      voice:
        name: "Voice"
        description: >-
          The voice it speaks with. marin and cedar are the newest and sound the
          most natural. A running conversation keeps its voice — restart the
          add-on after changing this. For an unlisted voice pick "custom" and
          fill in Voice (custom) below.
      voice_custom:
        name: "Voice (custom)"
        description: >-
          Only used when Voice is set to "custom". Any valid OpenAI voice name.
      speed:
        name: "Speaking speed"
        description: >-
          1.0 = normal. Lower is slower and clearer (down to 0.25), higher is
          faster (up to 1.5). Changes only the pace, not the words.
      reasoning_effort:
        name: "Reasoning effort"
        description: >-
          How hard the model thinks before it answers. "low" (default) is
          OpenAI's recommended start for voice: quick, and it still picks the
          right device. Higher thinks longer before answering, for harder
          requests; "minimal" is the quickest. gpt-realtime-1.5 doesn't reason
          and ignores this.
      max_output_tokens:
        name: "Maximum answer length"
        description: >-
          Caps how long an answer may get, in tokens (≈ 0.75 words each).
          0 = no cap. Set e.g. 1024 if it sometimes rambles on; too low cuts
          answers off mid-sentence.
      vad_eagerness:
        name: "Turn-taking speed"
        description: >-
          How quickly the assistant decides you've finished talking. "low"
          (default) waits patiently — best if you pause mid-sentence to think.
          "high" answers faster but may cut you off. "auto" lets OpenAI decide.
      noise_reduction:
        name: "Microphone noise reduction"
        description: >-
          Extra filtering of your voice before it reaches OpenAI. "off" is
          usually fine — the device already filters. Try "near_field" if you
          talk close to the device, "far_field" for across the room, when it
          mishears you in a noisy environment.
      web_search_model:
        name: "Search model"
        description: >-
          The model that does the lookup and summarises the answer. gpt-5.5
          (default) gives the best answers; mini/nano models are cheaper but miss
          more. For an unlisted model pick "custom" and fill in Search model
          (custom) below.
      web_search_model_custom:
        name: "Search model (custom)"
        description: >-
          Only used when Search model is set to "custom". Any model that supports
          OpenAI's web_search tool.
      max_context_tokens:
        name: "Conversation memory size (tokens)"
        description: >-
          How big a conversation may grow, in tokens, before OpenAI forgets its
          oldest half in one go. Every answer re-bills the whole conversation, so
          more = better memory but higher cost, and long chats can hit OpenAI rate
          limits. 8000 is a good balance; 0 = as much as the model allows. Too
          high a value for the model makes the conversation fail to start.
      session_reuse_timeout_seconds:
        name: "Conversation idle timeout (seconds)"
        description: >-
          How long a conversation stays open once you've stopped talking to the
          device (after its follow-up window, or a "stop"). Waking the assistant
          within this time continues the conversation; after it, the OpenAI
          session closes and the next wake starts afresh. 300 (5 min) is a good
          default; 0 = close as soon as the device stops listening.
      turn_detection_type:
        name: "Turn detection (legacy)"
        description: >-
          How the end of your question is detected. Normally leave this UNSET:
          the assistant then understands when your sentence is finished
          (semantic_vad). "server_vad" is the old silence-timer method, tuned by
          the three fields below — kept only as an escape hatch.
      vad_threshold:
        name: "server_vad: loudness threshold"
        description: >-
          Only with server_vad. How loud something must be to count as speech
          (0–1, default 0.5). Higher = fewer false triggers from background
          noise.
      vad_prefix_padding_ms:
        name: "server_vad: lead-in (ms)"
        description: >-
          Only with server_vad. Audio kept from just before speech was detected,
          so your first word isn't clipped (default 300).
      vad_silence_duration_ms:
        name: "server_vad: silence to end turn (ms)"
        description: >-
          Only with server_vad. How long a silence ends your question (default
          800). Raise it if you get cut off while pausing.

  # --- 🎙️ GPT-Live ---
  live:
    name: "🎙️ GPT-Live settings"
    description: >-
      Settings for the GPT-Live engine (Engine: live): a voice that hands
      anything that needs doing to a backend model, which uses the tools.
    fields:
      instructions:
        name: "Voice personality (prompt)"
        description: >-
          Instructions for the voice you talk to: its personality, its
          language, and what to hand to the backend. Lock the language here.
          EDITING TIP: for comfortable editing use the ⋮ menu at the top of
          this tab → "Edit in YAML".
      model:
        name: "Voice model"
        description: >-
          The GPT-Live model, gpt-live-1 (default).
      voice:
        name: "Voice"
        description: >-
          The voice it speaks with; GPT-Live has its own set, marin (default)
          among them. For an unlisted voice, or a custom voice's id, pick
          "custom" and fill in Voice (custom) below.
      voice_custom:
        name: "Voice (custom)"
        description: >-
          Only used when Voice is set to "custom".
      backend_model:
        name: "Backend model"
        description: >-
          The model the voice hands work to: it calls the Home Assistant tools
          and searches the web. gpt-6-luna (default) is quick; gpt-6-sol thinks
          harder, for more complex requests, and costs more. For another model
          pick "custom" and fill in Backend model (custom) below.
      backend_model_custom:
        name: "Backend model (custom)"
        description: >-
          Only used when Backend model is set to "custom". Any model for
          OpenAI's Responses API.
      backend_instructions:
        name: "Backend instructions (prompt)"
        description: >-
          Instructions for the backend model: how to use the tools, when to
          search the web rather than use what it knows or your home's sensors,
          and how to reply. Use "Edit in YAML" (⋮ menu) to edit comfortably.
      reasoning_effort:
        name: "Backend reasoning effort"
        description: >-
          How hard the backend thinks before it acts. "low" (default) is quick
          and still picks the right device; higher thinks longer, for harder
          requests; "minimal" is the quickest.
      service_tier:
        name: "Backend speed and price"
        description: >-
          "auto" (default) uses your OpenAI project's setting, normally
          "default". "priority" answers faster at a higher price, if your
          project has access to it.
      session_reuse_timeout_seconds:
        name: "Conversation idle timeout (seconds)"
        description: >-
          How long a conversation stays open once you've stopped talking to the
          device. GPT-Live bills every minute a conversation is open, so 0
          (default) closes it as soon as the device stops listening; the next
          wake starts afresh.

  # --- 💬 Conversation ---
  follow_up_listen_seconds:
    name: "💬 Conversation · Follow-up listening (seconds)"
    description: >-
      After an answer the device keeps listening this long, so you can simply
      keep talking — no wake word needed. The LED ring shows the listening
      colour while it waits. 8 feels natural; 0 turns it off (wake word
      before every question).
  follow_up_open_delay_ms:
    name: "💬 Conversation · Follow-up mic delay (ms)"
    description: >-
      Short pause between the end of an answer and the microphone re-opening,
      so the speaker's last echo can't trigger a ghost question. 700 (default)
      covers the speaker tail safely. Lowering it (300–500) makes the
      hand-over snappier, but risks the assistant answering its own echo —
      raise it back if it sometimes seems to answer nobody or repeats itself.
  wake_open_delay_ms:
    name: "💬 Conversation · Wake mic delay (ms)"
    description: >-
      The same echo guard right after the wake word: a short pause after the
      wake chime before the microphone opens, so the chime's own sound can't
      leak in and be mistaken for a question. 700 (default) is safe. Lower it
      for a snappier wake, raise it if saying the wake word sometimes triggers
      an answer to nothing.
  phase_idle_debounce_ms:
    name: "💬 Conversation · End-of-answer hold (ms)"
    description: >-
      How long the assistant must stay silent before the device considers the
      answer finished. This bridges the natural pauses between sentences and
      during smart-home actions, so the LED and the "stop" word keep working
      through the whole answer. 1500 is a good default; raise it if the
      device flips to idle in the middle of long answers.
  enable_end_conversation:
    name: "💬 Conversation · Let the assistant end the conversation"
    description: >-
      When you're clearly done ("thanks, that's all", "goodbye", "good night"),
      the assistant says goodbye and the device stops listening straight away,
      instead of keeping its follow-up window open. Even in a noisy room, a
      goodbye ends it. How readily it ends a conversation is set in its prompt
      (Realtime: instructions; GPT-Live: backend instructions). On by default.

  # --- 🌐 Web search ---
  enable_web_search:
    name: "🌐 Web search · Enable web search"
    description: >-
      Lets the assistant look things up online: weather, news, opening hours,
      recent events. Each lookup is one extra OpenAI call on your key (a few
      cents) and adds a couple of seconds. On by default. Turn it off for an
      assistant that only knows your home, or if Home Assistant offers it a
      search tool of its own. With GPT-Live, the backend model searches with
      OpenAI's own tool.

  # --- 🎚️ Audio ---
  playback_prebuffer_ms:
    name: "🎚️ Audio · Playback buffer (ms)"
    description: >-
      How much of the answer the device collects before it starts playing. A
      bigger buffer absorbs brief Wi-Fi hiccups (the occasional crackle), but
      every answer starts this much later. 150 is a good balance; raise to
      250–300 if you still hear crackle, 0 = play immediately.

  # --- 🏠 Home Assistant ---
  ha_mcp_url:
    name: "🏠 Home Assistant · MCP server URL"
    description: >-
      How the assistant controls your home. Leave EMPTY (recommended): it
      then uses Home Assistant's built-in "MCP Server" integration — install
      that integration and expose your entities to Assist. Only fill in a URL
      if you run the separate ha-mcp add-on instead.
  longlived_token:
    name: "🏠 Home Assistant · Access token"
    description: >-
      Leave empty (recommended): the add-on uses its own built-in permission.
      Only create and paste a long-lived token (your HA profile → Security)
      if the log shows a 401/403 error when you talk to the assistant.
  mcp_tool_allowlist:
    name: "🏠 Home Assistant · Tool allow-list"
    description: >-
      Comma-separated list of control tools the assistant may use; empty =
      all of them. With the built-in MCP server you can leave this empty.
      Mainly useful with the ha-mcp add-on (80+ tools) to keep conversations
      fast and cheap.

  # --- ⚙️ Advanced ---
  websocket_port:
    name: "⚙️ Advanced · Device port"
    description: >-
      The port the Voice PE connects to. Must match the va_url in the device
      firmware (default 8080). Only change this on a port clash —
      and update the device firmware stub to match.

  # --- 🔍 Debug ---
  log_what_you_say:
    name: "🔍 Debug · Log what you say"
    description: >-
      Writes what the assistant heard you say into the add-on log (the 🗣️
      lines), to find out what it misheard. A separate transcription model
      does this, at a small extra cost. It doesn't change how the assistant
      understands you: it hears your voice itself. Realtime only: GPT-Live
      always logs what it heard.
  transcription_language:
    name: "🔍 Debug · Languages you speak (e.g. en, or en, nl)"
    description: >-
      For Log what you say: the two-letter codes of the languages you speak
      to it, comma separated, to write them down accurately. Leave empty to
      use Home Assistant's own language; "auto" detects it each time. It
      doesn't change which language the assistant answers in; the
      instructions decide that.
  enable_recording:
    name: "🔍 Debug · Record audio"
    description: >-
      Saves each conversation's microphone and speaker audio as WAV files in
      the add-on's folder of the addon_configs share (Samba or File editor),
      under recordings. For troubleshooting only: the files are not deleted
      for you. Leave off normally.
  log_level:
    name: "🔍 Debug · Log detail"
    description: >-
      INFO is normal. DEBUG writes very detailed logs of every turn and
      connection — useful for bug reports.
