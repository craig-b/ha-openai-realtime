# Nederlandse namen + uitleg voor het Configuratie-tabblad. Gebruikers met
# Home Assistant in het Nederlands zien automatisch deze teksten; anderen de
# Engelse (en.yaml). Groepen via emoji-prefix — zelfde volgorde als config.yaml.
configuration:
  # --- 🔑 Basis ---
  openai_api_key:
    name: "🔑 Basis · OpenAI API-sleutel"
    description: >-
      Je persoonlijke OpenAI-sleutel (begint met sk-...). Maak er één aan op
      platform.openai.com → API keys, en zorg dat facturering is ingesteld.
      Alles wat de assistent doet — luisteren, denken, praten, zoeken op
      internet — loopt via deze sleutel.
  device_secret:
    name: "🔑 Basis · Apparaatgeheim"
    description: >-
      Een wachtwoord dat je Voice PE moet tonen om met deze add-on te
      verbinden, zodat niets anders op je netwerk via de add-on met de
      assistent kan praten. Gebruik minstens 16 tekens zonder spaties,
      bijvoorbeeld de uitvoer van `openssl rand -hex 32`, en zet dezelfde
      waarde als va_secret in je ESPHome-secrets.yaml. Zonder geheim start de
      add-on niet.

  engine:
    name: "🔑 Basis · Engine"
    description: >-
      Welk soort OpenAI-spraakmodel je gebruikt. "realtime" (standaard): één
      model luistert, denkt en spreekt, om de beurt. "live": GPT-Live, een stem
      die tegelijk luistert en spreekt en alles wat gedaan moet worden aan een
      slimmer backend-model overlaat; het rekent elke minuut dat een gesprek
      open is ($0,05) plus de tokens van de backend. Elke engine heeft
      hieronder een eigen instellingenpaneel; alleen dat van de gekozen engine
      wordt gebruikt.

  # --- ⚡ Realtime ---
  realtime:
    name: "⚡ Realtime-instellingen"
    description: >-
      Instellingen voor de Realtime-engine (Engine: realtime): OpenAI's gpt-realtime-modellen,
      die in één model luisteren, denken en spreken.
    fields:
      instructions:
        name: "Persoonlijkheid (systeemprompt)"
        description: >-
          Instructies in gewone taal die de assistent vormen: karakter, taal en
          huisregels. Schrijf het alsof je een persoon instrueert. Twee tips die
          er op een spraakapparaat toe doen: leg de taal vast ("Spreek en versta
          uitsluitend Nederlands. Wissel nooit van taal.") en zeg dat hij zijn
          gereedschap stil moet gebruiken in plaats van "momentje" te zeggen.
          BEWERK-TIP: dit veld is hier één regel (een beperking van de Home
          Assistant-interface) — gebruik voor comfortabel bewerken het ⋮-menu
          bovenaan dit tabblad → "Bewerken als YAML": dan krijg je een volwaardige
          teksteditor.
      model:
        name: "Model"
        description: >-
          Het OpenAI-model dat luistert en praat. gpt-realtime-2.1 (standaard)
          is het nieuwste en slimste. gpt-realtime-2.1-mini is veel goedkoper
          maar minder slim. gpt-realtime-2 is de versie vóór 2.1.
          gpt-realtime-1.5 is de oudere, die niet redeneert. Wil je een model dat er niet tussen staat? Kies "custom"
          en vul hieronder Model (custom) in.
      model_custom:
        name: "Model (custom)"
        description: >-
          Alleen gebruikt als Model op "custom" staat. Elk geldig OpenAI
          Realtime-model-id.
      voice:
        name: "Stem"
        description: >-
          De stem waarmee hij praat. marin en cedar zijn de nieuwste en klinken
          het natuurlijkst. Een lopend gesprek houdt zijn stem — herstart de
          add-on na het wijzigen. Voor een stem die er niet tussen staat: kies
          "custom" en vul hieronder Stem (custom) in.
      voice_custom:
        name: "Stem (custom)"
        description: >-
          Alleen gebruikt als Stem op "custom" staat. Elke geldige
          OpenAI-stemnaam.
      speed:
        name: "Spreektempo"
        description: >-
          1.0 = normaal. Lager is langzamer en duidelijker (minimaal 0.25), hoger
          is sneller (maximaal 1.5). Verandert alleen het tempo, niet de woorden.
      reasoning_effort:
        name: "Redeneerinspanning"
        description: >-
          Hoe lang het model nadenkt voordat het antwoordt. "low" (standaard)
          is OpenAI's aanbevolen begin voor spraak: snel, en het kiest nog steeds
          het juiste apparaat. Hoger denkt langer na voor het antwoordt, voor
          lastigere vragen; "minimal" is het snelst. gpt-realtime-1.5 redeneert
          niet en negeert dit.
      max_output_tokens:
        name: "Maximale antwoordlengte"
        description: >-
          Begrenst hoe lang een antwoord mag worden, in tokens (≈ 0,75 woord per
          stuk). 0 = geen limiet. Zet bijv. 1024 als hij soms blijft doorpraten;
          te laag kapt antwoorden midden in een zin af.
      vad_eagerness:
        name: "Beurtwissel-snelheid"
        description: >-
          Hoe snel de assistent beslist dat je uitgesproken bent. "low"
          (standaard) wacht geduldig — het fijnst als je midden in een zin even
          nadenkt. "high" antwoordt sneller maar kan je afkappen. "auto" laat
          OpenAI kiezen.
      noise_reduction:
        name: "Microfoon-ruisonderdrukking"
        description: >-
          Extra filtering van je stem voordat die naar OpenAI gaat. "off" is
          meestal prima — het apparaat filtert zelf al. Probeer "near_field" als
          je dichtbij praat, "far_field" voor door de kamer heen, wanneer hij je
          in een rumoerige omgeving slecht verstaat.
      web_search_model:
        name: "Zoekmodel"
        description: >-
          Het model dat de zoekopdracht uitvoert en het antwoord samenvat.
          gpt-6-luna (standaard) is het snelst en goedkoopst, en ruim genoeg voor
          de korte antwoorden van een spraakassistent die op zoekresultaten
          berusten; gpt-6.1-sol en gpt-6-astra denken langer na, trager en
          duurder. Voor een ander model: kies "custom" en vul hieronder
          Zoekmodel (custom) in.
      web_search_model_custom:
        name: "Zoekmodel (custom)"
        description: >-
          Alleen gebruikt als Zoekmodel op "custom" staat. Elk model dat OpenAI's
          web_search-tool ondersteunt.
      max_context_tokens:
        name: "Gespreksgeheugen (tokens)"
        description: >-
          Hoe groot een gesprek mag worden, in tokens, voordat OpenAI in één keer
          de oudste helft vergeet. Elk antwoord rekent het hele gesprek opnieuw
          af, dus meer = beter geheugen maar hogere kosten, en lange gesprekken
          kunnen tegen OpenAI-limieten aanlopen. 8000 is een goede balans; 0 =
          zoveel als het model toelaat. Een te hoge waarde voor het model laat
          het gesprek niet starten.
      mute_mic_while_speaking:
        name: "Microfoon dempen terwijl hij spreekt"
        description: >-
          Aan (standaard): terwijl de assistent spreekt, stuurt het apparaat je
          stem niet door; zeg "stop" (dat hoort het apparaat zelf) of druk op de
          knop om te onderbreken. Uit: je kunt er doorheen praten, maar op de
          Voice PE lekt zijn eigen stem terug in de microfoon en breekt die zijn
          antwoorden af.
      session_reuse_timeout_seconds:
        name: "Gesprek blijft open (seconden)"
        description: >-
          Hoe lang een gesprek openblijft nadat je bent gestopt met praten tegen
          het apparaat (na het vervolgvenster, of een "stop"). Wek je de
          assistent binnen deze tijd, dan gaat het gesprek verder; daarna sluit de
          OpenAI-sessie en begint de volgende keer opnieuw. 300 (5 min) is een
          goede standaard; 0 = sluiten zodra het apparaat stopt met luisteren.
      turn_detection_type:
        name: "Beurtdetectie (legacy)"
        description: >-
          Hoe het einde van je vraag wordt herkend. Normaal NIET instellen: de
          assistent begrijpt dan zelf wanneer je zin af is (semantic_vad).
          "server_vad" is de oude stiltetimer-methode, afgesteld met de drie
          velden hieronder — alleen bewaard als noodluik.
      vad_threshold:
        name: "server_vad: geluidsdrempel"
        description: >-
          Alleen bij server_vad. Hoe hard iets moet klinken om als spraak te
          tellen (0–1, standaard 0.5). Hoger = minder valse triggers door
          achtergrondgeluid.
      vad_prefix_padding_ms:
        name: "server_vad: aanloop (ms)"
        description: >-
          Alleen bij server_vad. Audio van vlak vóór de spraakdetectie die wordt
          meegenomen, zodat je eerste woord niet wegvalt (standaard 300).
      vad_silence_duration_ms:
        name: "server_vad: stilte = einde vraag (ms)"
        description: >-
          Alleen bij server_vad. Hoe lang een stilte je vraag beëindigt
          (standaard 800). Verhoog als je wordt afgekapt bij een pauze.

  # --- 🎙️ GPT-Live ---
  live:
    name: "🎙️ GPT-Live-instellingen"
    description: >-
      Instellingen voor de GPT-Live-engine (Engine: live): een stem die alles
      wat gedaan moet worden aan een backend-model overlaat, dat de tools
      gebruikt.
    fields:
      instructions:
        name: "Persoonlijkheid van de stem (prompt)"
        description: >-
          Instructies voor de stem waarmee je praat: karakter, taal, en wat hij
          aan de backend overlaat. Leg hier de taal vast. BEWERKTIP: gebruik
          het ⋮-menu bovenaan dit tabblad → "Bewerken als YAML".
      model:
        name: "Stemmodel"
        description: >-
          Het GPT-Live-model, gpt-live-1 (standaard).
      voice:
        name: "Stem"
        description: >-
          De stem waarmee hij praat; GPT-Live heeft een eigen set, met marin
          (standaard). Voor een andere stem, of het id van een eigen stem: kies
          "custom" en vul hieronder Stem (custom) in.
      voice_custom:
        name: "Stem (custom)"
        description: >-
          Alleen gebruikt als Stem op "custom" staat.
      backend_model:
        name: "Backend-model"
        description: >-
          Het model waaraan de stem het werk overlaat: het gebruikt de Home
          Assistant-tools en zoekt op internet. gpt-6-luna (standaard) is snel;
          gpt-6-sol denkt beter na, voor lastigere vragen, en kost meer. Voor een
          ander model: kies "custom" en vul hieronder Backend-model (custom) in.
      backend_model_custom:
        name: "Backend-model (custom)"
        description: >-
          Alleen gebruikt als Backend-model op "custom" staat. Elk model voor
          OpenAI's Responses API.
      backend_instructions:
        name: "Backend-instructies (prompt)"
        description: >-
          Instructies voor het backend-model: hoe het de tools gebruikt, wanneer
          het op internet zoekt in plaats van wat het weet of je sensoren te
          gebruiken, en hoe het antwoordt. Bewerk via "Bewerken als YAML"
          (⋮-menu).
      reasoning_effort:
        name: "Redeneerinspanning van de backend"
        description: >-
          Hoe lang de backend nadenkt voordat hij iets doet. "low" (standaard)
          is snel en kiest nog steeds het juiste apparaat; hoger denkt langer na,
          voor lastigere vragen; "minimal" is het snelst.
      service_tier:
        name: "Snelheid en prijs van de backend"
        description: >-
          "auto" (standaard) volgt de instelling van je OpenAI-project, meestal
          "default". "priority" antwoordt sneller tegen een hogere prijs, als je
          project er toegang toe heeft.
      session_reuse_timeout_seconds:
        name: "Wachttijd gesprek (seconden)"
        description: >-
          Hoe lang een gesprek open blijft nadat je bent gestopt met praten.
          GPT-Live rekent elke minuut dat een gesprek open is, dus 0 (standaard)
          sluit het zodra het apparaat stopt met luisteren; de volgende wake
          begint opnieuw.
      mute_mic_while_speaking:
        name: "Microfoon dempen terwijl hij spreekt"
        description: >-
          Uit (standaard): je kunt er doorheen praten en hij stopt om te
          luisteren; GPT-Live onderscheidt zijn eigen stem van de jouwe. Aan:
          terwijl hij spreekt stuurt het apparaat je stem niet door; zeg "stop"
          of druk op de knop om te onderbreken.

  # --- 💬 Gesprek ---
  follow_up_listen_seconds:
    name: "💬 Gesprek · Naluisteren (seconden)"
    description: >-
      Na een antwoord blijft het apparaat zo lang luisteren, zodat je gewoon
      kunt doorpraten — zonder opnieuw het wake-woord te zeggen. De LED-ring
      toont ondertussen de luisterkleur. 8 voelt natuurlijk; 0 zet het uit
      (wake-woord voor elke vraag).
  follow_up_open_delay_ms:
    name: "💬 Gesprek · Naluister-vertraging (ms)"
    description: >-
      Korte pauze tussen het einde van een antwoord en het heropenen van de
      microfoon, zodat de laatste echo uit de speaker geen spookvraag kan
      veroorzaken. 700 (standaard) dekt de speaker-naloop veilig af. Lager
      (300–500) maakt doorpraten vlotter, maar dan kan de assistent zijn
      eigen echo gaan beantwoorden — verhoog weer als hij soms "tegen
      niemand" praat of zichzelf herhaalt.
  wake_open_delay_ms:
    name: "💬 Gesprek · Wake-microfoon-vertraging (ms)"
    description: >-
      Dezelfde echo-bescherming vlak na het wake-woord: een korte pauze na de
      wake-toon voordat de microfoon opengaat, zodat het geluid van de toon
      zelf niet naar binnen lekt en als vraag wordt opgevat. 700 (standaard)
      is veilig. Lager voor een vlottere wake; verhoog als het uitspreken van
      het wake-woord soms een antwoord op niets uitlokt.
  phase_idle_debounce_ms:
    name: "💬 Gesprek · Einde-antwoord-marge (ms)"
    description: >-
      Hoe lang de assistent stil moet zijn voordat het apparaat het antwoord
      als afgerond beschouwt. Dit overbrugt de natuurlijke pauzes tussen
      zinnen en tijdens smart-home-acties, zodat de LED en het "stop"-woord
      het hele antwoord blijven werken. 1500 is een goede standaard; verhoog
      als het apparaat midden in lange antwoorden al op rust springt.
  enable_end_conversation:
    name: "💬 Gesprek · Laat de assistent het gesprek beëindigen"
    description: >-
      Als je duidelijk klaar bent ("bedankt, dat was het", "doei", "welterusten"),
      neemt de assistent afscheid en stopt het apparaat meteen met luisteren, in
      plaats van het vervolgvenster open te houden. Ook in een rumoerige kamer
      beëindigt een afscheid het gesprek. Hoe snel hij een gesprek beëindigt,
      staat in zijn prompt (Realtime: instructies; GPT-Live:
      backend-instructies). Standaard aan.
  # --- 🌐 Websearch ---
  enable_web_search:
    name: "🌐 Websearch · Zoeken op internet"
    description: >-
      Laat de assistent dingen online opzoeken: weer, nieuws, openingstijden,
      actualiteiten. Elke zoekactie is één extra OpenAI-aanroep op jouw
      sleutel (een paar cent) en duurt een paar seconden extra. Standaard aan.
      Zet het uit voor een assistent die alleen je huis kent, of als Home
      Assistant hem een eigen zoektool geeft. Met GPT-Live zoekt het
      backend-model met OpenAI's eigen tool.

  # --- 🎚️ Audio ---
  playback_prebuffer_ms:
    name: "🎚️ Audio · Afspeelbuffer (ms)"
    description: >-
      Hoeveel van het antwoord het apparaat verzamelt voordat het begint af te
      spelen. Een grotere buffer vangt korte wifi-haperingen op (het
      incidentele krakje), maar elk antwoord begint zoveel later. 150 is een
      goede balans; verhoog naar 250–300 bij blijvend kraken, 0 = direct
      afspelen.

  # --- 🏠 Home Assistant ---
  ha_mcp_url:
    name: "🏠 Home Assistant · MCP-server-URL"
    description: >-
      Hoe de assistent je huis bestuurt. LEEG laten (aanbevolen): dan gebruikt
      hij Home Assistants ingebouwde "MCP Server"-integratie — installeer die
      integratie en stel je entiteiten beschikbaar aan Assist. Vul alleen een
      URL in als je de losse ha-mcp-add-on gebruikt.
  longlived_token:
    name: "🏠 Home Assistant · Toegangstoken"
    description: >-
      Leeg laten (aanbevolen): de add-on gebruikt zijn eigen ingebouwde
      toestemming. Maak alleen een long-lived token aan (je HA-profiel →
      Beveiliging) als het log een 401/403-fout toont wanneer je tegen de
      assistent praat.
  mcp_tool_allowlist:
    name: "🏠 Home Assistant · Tool-allowlist"
    description: >-
      Kommagescheiden lijst van besturingstools die de assistent mag
      gebruiken; leeg = allemaal. Met de ingebouwde MCP-server kun je dit
      leeg laten. Vooral nuttig met de ha-mcp-add-on (80+ tools) om gesprekken
      snel en goedkoop te houden.
  home_town:
    name: "🏠 Home Assistant · Plaats waar het huis staat"
    description: >-
      Voor lokale antwoorden: "wat voor weer is het?" heeft dan geen plaats
      nodig. De instellingen van Home Assistant geven al het land, de tijdzone
      en de temperatuureenheid, die de assistent ook krijgt; een plaats staat
      er niet in. Wordt met je vragen naar OpenAI gestuurd. Laat leeg om
      alleen die te geven.

  # --- ⚙️ Geavanceerd ---
  websocket_port:
    name: "⚙️ Geavanceerd · Apparaat-poort"
    description: >-
      De poort waarop de Voice PE verbindt. Moet overeenkomen met de va_url in
      de apparaat-firmware (standaard 8080). Alleen wijzigen bij een
      poortconflict — en pas dan ook de firmware-stub aan.

  # --- 🔍 Debug ---
  log_what_you_say:
    name: "🔍 Debug · Log wat je zegt"
    description: >-
      Schrijft in het add-on-log wat de assistent je hoorde zeggen (de
      🗣️-regels), om uit te zoeken wat hij verkeerd verstond. Een apart
      transcriptiemodel doet dit, tegen een kleine meerprijs. Het verandert
      niet hoe de assistent je verstaat: die hoort je stem zelf. Alleen voor
      Realtime: GPT-Live logt altijd wat hij hoorde.
  transcription_language:
    name: "🔍 Debug · Talen die je spreekt (bijv. nl, of nl, en)"
    description: >-
      Voor Log wat je zegt: de tweeletterige codes van de talen die je tegen
      het apparaat spreekt, gescheiden door komma's, om ze nauwkeurig uit te
      schrijven. Leeg = de taal van Home Assistant zelf; "auto" herkent de taal
      elke keer. Het bepaalt niet in welke taal de assistent antwoordt; dat
      doen de instructies.
  enable_recording:
    name: "🔍 Debug · Audio opnemen"
    description: >-
      Slaat de microfoon- en speakeraudio van elk gesprek op als WAV-bestanden
      in de map van de add-on in de addon_configs-share (Samba of File
      editor), onder recordings. Alleen voor probleemanalyse: de bestanden
      worden niet voor je verwijderd. Normaal uit laten.
  log_level:
    name: "🔍 Debug · Log-detail"
    description: >-
      INFO is normaal. DEBUG schrijft zeer gedetailleerde logs van elke beurt
      en verbinding — nuttig voor foutrapporten.
