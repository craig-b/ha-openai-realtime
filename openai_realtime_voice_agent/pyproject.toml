[project]
name = "openai-realtime-voice-agent"
version = "0.1.0"
description = "Home Assistant add-on: a voice agent for the Voice PE on the OpenAI Realtime API"
authors = [{name = "Your Name", email = "your.email@example.com"}]
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "mcp>=1.30.0",
    "numpy>=2.2.6",
    "openai>=2.54.0",
    "python-dotenv>=1.0.0",
    "soxr>=0.5.0",
    "websockets>=15.0.1",
]

# An application, not a distributable package: the image runs the app from
# /app (`python3 -m app.main`) and only installs its locked dependencies.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "uvicorn>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
