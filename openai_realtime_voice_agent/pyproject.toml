[project]
name = "openai-realtime-voice-agent"
version = "0.1.0"
description = "Home Assistant addon for OpenAI Realtime API voice control with WebSocket support using Pipecat"
authors = [{name = "Your Name", email = "your.email@example.com"}]
requires-python = ">=3.11,<3.14"
dependencies = [
    # Pinned to the 0.0.x line: this codebase targets the Pipecat 0.0.x API
    # (FrameSerializerType, OpenAIRealtimeLLMService, SessionProperties events,
    # WebsocketServerParams). Without a lockfile pip otherwise resolves Pipecat
    # 1.x, whose changed API breaks the imports. 0.0.97 is the version this was
    # developed/tested against.
    "pipecat-ai[mcp,openai,websocket]==0.0.97",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "websockets>=13.0",
]

# An application, not a distributable package: the image runs the app from
# /app (`python3 -m app.main`) and only installs its locked dependencies.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
